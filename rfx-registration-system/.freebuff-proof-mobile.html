<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust card mobile proof</title>
<link rel="stylesheet" href="css/system.css?v=20260810-59">
<style>
  body { background: #080808; padding: 20px; }
  .stage { max-width: 420px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 18px; }
  .stage .card { height: auto; min-height: 320px; }
</style>
</head>
<body>
<div class="stage">
  <div id="trust"></div>
  <div id="mach"></div>
</div>
<script src="assets/icons.js?v=20260810-59"></script>
<script src="js/db.js?v=20260810-59"></script>
<script src="js/ui.js?v=20260810-59"></script>
<script>
  window.addEventListener('load', function () {
    try {
      var ui = window.RFX.ui, db = window.RFX.db, I = window.RFX.icons || {};
      document.getElementById('trust').innerHTML =
        '<div class="card trust-card" style="cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px 22px;">' +
        ui.trustRingHTML(100, { tierCls: '', cap: 'standing' }) +
        '<div style="max-width:280px;">' +
        '<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;">' +
        '<span class="ic" style="color:var(--gold-bright);">' + (I.shieldCheck || '') + '</span>' +
        '<span class="eyebrow muted" style="margin-bottom:0;">Your Trust</span></div>' +
        '<div style="font-size:14px;color:var(--text);font-weight:600;">Excellent standing</div>' +
        '<div class="small faint" style="margin-top:4px;">1 recorded action · click to view →</div>' +
        '</div></div>';
      var headroom = 62.4;
      document.getElementById('mach').innerHTML =
        '<div class="card machinery" style="grid-column:1/-1;border-color:rgba(212,175,55,0.35);">' +
        '<div class="mach-rings">' +
        ui.trustRingHTML(100, { cap: 'checks' }) + ui.trustRingHTML(100, { cap: 'security' }) +
        ui.trustRingHTML(100, { cap: 'cyber' }) + ui.trustRingHTML(headroom, { cap: 'headroom' }) +
        '</div></div>';
    } catch (e) {
      document.body.textContent = 'ERR: ' + e.message;
    }
    setTimeout(function () {
      var out = {};
      var t = document.querySelector('.trust-card');
      var mr = document.querySelector('.mach-rings');
      if (t) {
        var r = t.querySelector('.trust-ring');
        var tr = t.getBoundingClientRect(), rr = r.getBoundingClientRect();
        out.trustCenterDelta = Math.round(Math.abs((rr.left + rr.width / 2) - (tr.left + tr.width / 2)));
        out.trustFlexDir = getComputedStyle(t).flexDirection;
        out.trustCardW = Math.round(tr.width);
      }
      if (mr) {
        out.machCols = getComputedStyle(mr).gridTemplateColumns;
        out.ringCount = mr.querySelectorAll('.trust-ring').length;
      }
      out.vw = window.innerWidth;
      out.ready = true;
      document.body.setAttribute('data-out', JSON.stringify(out));
    }, 300);
  });
</script>
</body>
</html>
